schemaVersion: "2.2"
description: "LIA 운영 배포(D86) — git pull 후 ops/deploy/cd-deploy.sh 실행. 등록: docs/backend/cloud-infra.md 런북"
parameters:
  tag:
    type: String
    description: "이미지 태그 — 커밋 SHA 40자 또는 current(지금 이미지로 ops 만 반영)"
    allowedPattern: "^([0-9a-f]{40}|current)$"
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      timeoutSeconds: "5400"
      runCommand:
        - set -euo pipefail
        - cd /opt/lia
        - flock -w 600 /var/lock/lia-deploy.lock git pull --ff-only
        - exec bash /opt/lia/ops/deploy/cd-deploy.sh "{{ tag }}"
