[project]
name = "lia-pipeline"
version = "0.1.0"
description = "입법 영향 분석기 - 수집·소스분석·해석 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",        # config.yaml 로딩
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "trafilatura>=1.9",   # URL 본문 추출
    "rapidfuzz>=3.9",     # 의안 퍼지 매칭(미설치 시 difflib 폴백)
    # "python-dotenv>=1.0",  # .env 자동 로드(선택)
    # "openai>=1.30",     # 영향 추론 LLM (PoC에서는 선택)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lia_pipeline"]
