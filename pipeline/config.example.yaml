# 입법 영향 분석기 — 파이프라인 설정 (예시)
#
# 사용법:
#   1) 이 파일을 `config.yaml` 로 복사
#   2) 값을 채운다 (config.yaml 은 .gitignore 대상 — 실제 키 커밋 안 됨)
#
# 값에는 ${ENV_VAR} 보간을 쓸 수 있다(환경변수 또는 .env). 보간 없이 키 문자열을
# 직접 넣어도 된다. 예) api_key: "abcd1234..."   또는   api_key: "${ASSEMBLY_API_KEY}"

# ⚠️ 헷갈림 주의: 법제처(MOLEG)가 '입법예고'와 '국가법령정보센터'를 둘 다 운영한다.
#    아래 키는 '운영기관'이 아니라 '내용' 기준이다:
#      assembly = 의원발의 법안        (열린국회)
#      moleg    = 정부제출 법안(입법예고) (법제처 입법예고)   ← 미래 시행될 법안
#      law      = 현행 법령            (국가법령정보/law.go.kr) ← diff 기준선
sources:
  assembly:   # 열린국회정보(open.assembly.go.kr) — 의원발의 법안
    api_key: "${ASSEMBLY_API_KEY}"   # 실제 키는 .env 에 (config.yaml 은 참조만)
    service: "nzmimeepazxkubdpn"  # 의원발의 법률안 목록
    age: "22"                     # 국회 대수(필수). 22대=현재, 21대=이전
    base: "https://open.assembly.go.kr/portal/openapi"
    page_size: 100
    timeout: 20
    max_retries: 3
  # 아래 둘은 법제처 계열 — 인증이 ServiceKey가 아니라 OC(회원 이메일 아이디)다.
  moleg:      # 법제처 정부입법예고(lawmaking.go.kr) — 정부제출 법안(입법예고)
    oc: "${MOLEG_OC}"       # 회원가입 이메일의 아이디 부분 = OC
    base: "https://opinion.lawmaking.go.kr"
  law:        # 국가법령정보(open.law.go.kr) — 현행 법령(= diff 기준선)
    oc: "${LAW_OC}"         # 회원가입 이메일의 아이디 부분 = OC
    base: "https://www.law.go.kr"

embedding:                        # 임베딩(외부 API) — 벤치로 벤더 확정
  provider: "openai"              # openai | upstage
  model: "text-embedding-3-small"
  dim: 1536
  api_key: "${OPENAI_API_KEY}"

llm:                              # 영향 추론 (foundation API)
  provider: "anthropic"
  model: "claude-opus-4-8"
  api_key: "${ANTHROPIC_API_KEY}"

database:
  url: "${DATABASE_URL}"
