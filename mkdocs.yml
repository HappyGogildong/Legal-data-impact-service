site_name: 입법 영향 분석기 (LIA) — 설계 문서
site_description: Legislative Impact Analyzer 아키텍처·ADR·프롬프트·컴포넌트 스펙
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: ko
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드

# Obsidian 호환 + mermaid 렌더를 위한 확장/플러그인
markdown_extensions:
  - admonition            # > [!note] → callouts 플러그인이 변환한 결과를 렌더
  - pymdownx.details      # 접을 수 있는 콜아웃
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid          # ```mermaid 블록을 다이어그램으로
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search            # 한국어 형태소 토크나이저 미지원(아래 주의) — 기본 검색 사용
  - callouts          # Obsidian `> [!warning]` → Material admonition 변환
  - roamlinks         # Obsidian `[[파일명]]` / `[[파일명|별칭]]` → 상대 링크 변환

