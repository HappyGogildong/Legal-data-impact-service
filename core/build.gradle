// LIA core — Spring Boot 4.0 + Spring AI 2.0 (D35: 파이프라인 통합 런타임)
// 버전 변경점: docs/reference/spring-migration.md
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'          // GA 2025-11. 패치(4.0.x) 추적 권장
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lia'
version = '0.2.0'
// Boot 4.0 최소는 Java 17이지만 최신 LTS 사용을 권장한다 → Java 21 LTS 고정.
// sourceCompatibility 대신 toolchain 을 쓰는 이유: 전자는 *source 레벨*만 낮출 뿐
// 컴파일러가 상위 JDK API 에 링크하는 것을 막지 못해, JDK 21 런타임에서
// NoSuchMethodError 가 나는 클래스가 만들어질 수 있다. toolchain 은 JDK 자체를 고정한다.
java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencyManagement {
    imports {
        // Spring AI 2.0 GA (2026-05-28). Boot 4 전용 — 3.x와 혼용 불가
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // --- 관측성 (D48 측정 선행) ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'   // /actuator/prometheus
    implementation 'io.micrometer:micrometer-registry-prometheus'            // 지표 → Prometheus
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'            // 트레이스(Micrometer Observation → OTel)
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'            // OTLP → Tempo

    // 레포 루트 .env 를 Spring Environment 로 로드 (D39: 자격증명 단일 소스)
    // Spring Boot 자체는 .env 를 읽지 않음 → 로컬/IDE 실행용. 컨테이너는 compose env_file 사용
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // --- Spring AI (D35 매핑) ---
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'  // AnalysisEngine 추론 (ChatClient, Opus 4.8)
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'     // Embedder (Upstage는 base-url 오버라이드)
    // RAGIndexer 단계에서 활성화 (pgvector VectorStore + JDBC):
    // implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    // implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // runtimeOnly 'org.postgresql:postgresql'

    // 도메인 영속화 단계에서 활성화:
    // implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// 자격증명 단일 소스(D39): 레포 루트 .env 를 읽어 JVM 환경변수로 주입한다.
// Spring Boot 는 .env 를 직접 읽지 않고, spring-dotenv 의 디렉터리 지정도
// Environment 준비 이전 단계라 신뢰하기 어려워 Gradle 에서 명시적으로 넣는다.
// (컨테이너 실행은 docker-compose 의 env_file: .env 가 담당)
def loadDotenv = { ->
    def f = rootProject.file('../.env')
    def map = [:]
    if (f.exists()) {
        f.eachLine('UTF-8') { line ->
            line = line.trim()
            if (line && !line.startsWith('#') && line.contains('=')) {
                def i = line.indexOf('=')
                def k = line.substring(0, i).trim()
                def v = line.substring(i + 1).trim().replaceAll(/^["']|["']$/, '')
                if (k && v) map[k] = v
            }
        }
    }
    return map
}

tasks.named('test') {
    useJUnitPlatform()
    environment loadDotenv()
}

tasks.named('bootRun') {
    environment loadDotenv()
}

