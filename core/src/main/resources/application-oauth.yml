# 소셜 OAuth2 로그인 등록(D60) — profile=oauth 에서만 로드.
#   기본/CI 부팅은 이 파일을 안 읽어 깨끗하고(빈 client-id 검증 실패 회피),
#   키가 있는 배포/로컬만 `--spring.profiles.active=oauth` 로 활성화한다. 키는 .env(D39).
#   ⚠️ SecurityConfig.oauth2Login() 은 ClientRegistrationRepository 빈이 있어야 부팅 →
#      이 프로파일이 켜졌을 때만 oauth2Login() 을 붙이도록 SecurityConfig 에서 조건부 처리.
#   scope 는 식별자 + email(알림 채널)만 — 이름/닉네임 scope 는 요청하지 않는다(D41 최소 수집).
#   요청하면 principal 속성으로 세션 SecurityContext 에 세션 내내 남는다.
spring:
  security:
    oauth2:
      client:
        registration:
          google:                     # Spring 내장 provider — registration 만
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email]    # profile 제외(이름). openid → OIDC, subject=sub
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post   # kakao 는 secret 을 body 로
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: [account_email]                             # 알림 채널(동의 필요). id 는 scope 무관 항상 반환
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope: [email]                                     # name 제외. naver 는 콘솔 제공항목 설정도 함께 최소화
            client-name: Naver
        provider:                     # kakao·naver 는 내장 아님 → 엔드포인트 명시
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response      # naver 는 사용자정보를 response 아래로 감쌈
