# LIA core — Boot 4.0 + Spring AI 2.0
# 비밀값은 **레포 루트 `.env` 하나**가 단일 소스(D39). 주입 경로 2가지:
#   · 로컬/IDE/gradlew  → spring-dotenv 가 아래 env.directory 의 .env 를 로드
#   · docker compose    → core 서비스의 env_file: .env 로 환경변수 주입
# 둘 다 없으면 각 키는 빈 문자열(`${VAR:}`)이 되어 커넥터가 명시적으로 실패한다.

env:
  directory: ..            # core/ 기준 상위 = 레포 루트 (.env 위치)
  filename: .env

lia:
  sources:
    assembly:                       # 열린국회 — 의원발의 법안 (ServiceKey)
      api-key: ${ASSEMBLY_API_KEY:}
      service: nzmimeepazxkubdpn    # 의원발의 법률안 목록
      age: "22"                     # 국회 대수(필수). 22대=현재
      base: https://open.assembly.go.kr/portal/openapi
      page-size: 100
      timeout: 20
      max-retries: 3
    moleg:                          # 법제처 입법예고 — 정부제출 법안 (OC=회원 이메일 아이디)
      oc: ${MOLEG_OC:}
      base: https://opinion.lawmaking.go.kr
    law:                            # 국가법령정보 — MVP 분석 대상 (OC). D42
      oc: ${LAW_OC:}                #   target=eflaw → 시행예정 법령(분석 대상)
      base: https://www.law.go.kr   #   target=law   → 시행중 법령(diff 기준선)
      timeout: 20
      max-retries: 3
  embedding:                        # Embedder(D32) — dim 단일 소스. 모델/키는 spring.ai.openai
    dim: 1536                       #   LawStore chunks(pgvector) 차원과 반드시 일치
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}   # 로그인 성공·실패 후 리다이렉트할 웹 UI(#14) 주소
  privacy:
    policy-version: ${PRIVACY_POLICY_VERSION:draft-2026-09}   # 동의 시 기록할 처리방침 버전(D61). 실제 처리방침 게시 시 교체
  personalization:
    daily-limit: ${LIA_PERSONALIZATION_DAILY_LIMIT:20}   # 사용자별 하루 Layer B(내 영향·대응 방안) 생성 한도(D69)
  bookmarks:
    max-per-user: ${LIA_BOOKMARKS_MAX_PER_USER:100}   # 사용자당 관심 법령 북마크 최대 개수(D72)
  discovery:                        # 법령 발견(LOOKUP, D70)
    chunk-fetch: 40                 # 법령 단위로 묶기 전에 가져올 청크 수
    max-candidates: 10              # 후보 최대 장수(S04)
    min-similarity: 0.3             # 코사인 유사도 하한 — 클라우드 전체 색인 뒤 실데이터로 조정
    snippet-chars: 80               # 쉬운 요약이 없을 때 개정 이유를 보여 줄 글자 수
    candidate-statuses: 시행예정      # 후보로 남길 정본 상태(쉼표 구분) — 최근 시행 포함은 별도 하위 프로젝트

spring:
  application:
    name: lia-core
  datasource:                                   # Law Store (D54). 값은 .env/compose 로 오버라이드
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lia}
    username: ${SPRING_DATASOURCE_USERNAME:lia}
    password: ${SPRING_DATASOURCE_PASSWORD:lia}
    hikari:
      initialization-fail-timeout: -1           # 시작 시 즉시 연결 안 함 — DB 없어도 컨텍스트는 뜬다(쿼리 시 연결)
  flyway:
    enabled: true                               # 시작 시 스키마 마이그레이션(실행엔 DB 필요). 테스트·demo는 끔
    locations: classpath:db/migration
  ai:
    anthropic:                      # AnalysisEngine 추론 (D68: Opus 5.5)
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-5-5
          max-tokens: 16000           # thinking 토큰 포함 — 구조화 JSON 이 잘리지 않게(D68)
    chat:
      observations:
        log-prompt: false           # 프롬프트(프로필·질문 포함)를 로그·트레이스에 남기지 않는다(D41·D69) — 기본값을 명시해 고정
        log-completion: false
    openai:                         # Embedder (D32: 외부 임베딩 API, dim 1536)
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
      # Upstage 벤치 시: base-url/모델 오버라이드 (OpenAI-호환)
      # base-url: https://api.upstage.ai
    vectorstore:
      observations:
        log-query-response: false   # 벡터 검색 질의·결과를 로그에 남기지 않는다 — 검색어에 프로필 라벨이 들어갈 수 있다(D41·D70)
      pgvector:                       # ChunkStore (D54·D55) — add/search 시 위 openai 모델로 내부 임베딩
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536              # lia.embedding.dim 과 일치해야 함
        initialize-schema: true       # vector_store 테이블·확장·인덱스 자동 생성(벡터 스키마는 PgVectorStore 소유)

# 소셜 OAuth2 로그인(D60) 등록은 application-oauth.yml(profile=oauth)로 분리 — 키 없는 dev/CI 부팅 보호.

# OpenAPI(D64) — 웹(Next.js)이 TS 타입을 생성하는 원천. 레포 api/openapi.json 스냅샷과 OpenApiSnapshotTest 로 동기.
# 운영은 SPRINGDOC_API_DOCS_ENABLED=false 로 끈다(ops/deploy/prod.env).
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  writer-with-order-by-keys: true     # 키 정렬 — 스냅샷이 실행마다 같도록
  default-produces-media-type: application/json   # 응답이 */* 로 나오지 않게(웹 타입 생성)

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true               # XSS 방어(JS 접근 차단)
        same-site: lax                # CSRF 완화(같은 도메인 UI)
        # secure: 미설정 → HTTPS 요청에서만 Secure 플래그(로컬 HTTP dev 무해·prod HTTPS 자동)

# --- 관측성 (D48 측정 선행) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: lia-core          # 모든 지표 공통 태그
  otlp:
    metrics:
      export:
        enabled: false               # 지표는 Prometheus 스크레이프만. OTLP 메트릭 push 비활성
                                     # (starter-opentelemetry가 딸려 넣은 OtlpMeterRegistry가 :4318/v1/metrics로 쏘던 것)
  tracing:
    sampling:
      probability: 1.0               # dev: 전량 샘플링. prod에서 낮춘다
  opentelemetry:                     # Boot 4.0 네임스페이스(구 management.otlp.tracing 아님)
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces   # → Tempo(OTLP HTTP). 트레이스만 OTLP

logging:
  level:
    com.lia.core.observability: INFO   # 오프라인 파이프라인 계측 로그
