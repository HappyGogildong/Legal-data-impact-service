# 테스트 전용 오버라이드 — 관측 export를 끈다(테스트는 계기판이 필요 없다).
# .properties 라 메인 application.yml 을 대체하지 않고 병합된다(lia.sources 등 유지).
# OTLP 메트릭은 메인에서 이미 off, 여기선 트레이싱까지 꺼 localhost:4318 을 아예 안 건드린다.
management.tracing.enabled=false
# DB 없는 @SpringBootTest(CredentialLoading·라이브 스모크)가 뜨도록 Flyway 끔.
# Law Store 통합 테스트는 Testcontainers로 자체 DataSource+Flyway 를 쓴다(@SpringBootTest 아님).
spring.flyway.enabled=false
# PgVectorStore 스키마 초기화도 끔 — 무DB 컨텍스트에서 시작 시 연결하지 않게(빈 생성만).
# ChunkStore 통합 테스트는 Testcontainers로 자체 PgVectorStore(initializeSchema=true)를 만든다.
spring.ai.vectorstore.pgvector.initialize-schema=false
