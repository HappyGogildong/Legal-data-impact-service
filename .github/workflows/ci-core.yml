name: CI core

# 백엔드 — core, 계약(api/openapi.json 스냅샷), 웹 프로필 선택지(web/src/lib/profile-options.json: ProfileOptionsSyncTest 가 읽음)가 바뀔 때만. 문서만 바뀐 PR 은 돌지 않는다.
on:
  push:
    branches: [main]
    paths: ["core/**", "api/**", "web/src/lib/profile-options.json", ".github/workflows/ci-core.yml"]
  pull_request:
    branches: [main]
    paths: ["core/**", "api/**", "web/src/lib/profile-options.json", ".github/workflows/ci-core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest   # Docker 내장 → Testcontainers 통합테스트 가능
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 단위 + Testcontainers 통합. 라이브 스모크는 OC/LIA_*_LIVE 미설정으로 자동 skip(결정론 오프라인).
      - name: Test
        working-directory: core
        run: ./gradlew --no-daemon test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Dockerfile 유효성 검증(레지스트리 push·CD 는 후속)
      - name: Build image
        run: docker build -t lia-core:ci ./core
