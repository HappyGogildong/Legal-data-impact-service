name: CI core

# 백엔드 — core, 계약(api/openapi.json 스냅샷), 웹 프로필 선택지(web/src/lib/profile-options.json: ProfileOptionsSyncTest 가 읽음)가 바뀔 때만. 문서만 바뀐 PR 은 돌지 않는다.
on:
  push:
    branches: [main]
    paths: ["core/**", "api/**", "web/src/lib/profile-options.json", ".github/workflows/ci-core.yml"]
  pull_request:
    branches: [main]
    paths: ["core/**", "api/**", "web/src/lib/profile-options.json", ".github/workflows/ci-core.yml"]

jobs:
  test:
    runs-on: ubuntu-latest   # Docker 내장 → Testcontainers 통합테스트 가능
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 단위 + Testcontainers 통합. 라이브 스모크는 OC/LIA_*_LIVE 미설정으로 자동 skip(결정론 오프라인).
      - name: Test
        working-directory: core
        run: ./gradlew --no-daemon test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 런타임 단계(apt-get) 용
      - uses: docker/setup-buildx-action@v3
      # PR — 빌드 검증만(push 없음, amd64)
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./core
          platforms: linux/amd64
          push: false
      # main — arm64·amd64 → GHCR(D63). 태그: 커밋 SHA · main. 배포는 수동(ops/deploy/lia up <SHA>)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (main)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/happygogildong/lia-core:${{ github.sha }}
            ghcr.io/happygogildong/lia-core:main
