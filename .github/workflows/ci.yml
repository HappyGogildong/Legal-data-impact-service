name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest   # Docker 내장 → Testcontainers 통합테스트 가능
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 단위 + Testcontainers 통합. 라이브 스모크는 OC/LIA_*_LIVE 미설정으로 자동 skip(결정론 오프라인).
      - name: Test
        working-directory: core
        run: ./gradlew --no-daemon test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Dockerfile 유효성 검증(레지스트리 push·CD 는 후속)
      - name: Build image
        run: docker build -t lia-core:ci ./core

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json   # packageManager 의 pnpm 버전
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 백엔드 계약(api/openapi.json)과 웹 타입이 어긋나면 실패(D64)
      - name: API 타입 동기 확인
        run: pnpm gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E(빌드 포함, 모의 API)
        run: pnpm e2e
