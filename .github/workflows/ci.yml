name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest   # Docker 내장 → Testcontainers 통합테스트 가능
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 단위 + Testcontainers 통합. 라이브 스모크는 OC/LIA_*_LIVE 미설정으로 자동 skip(결정론 오프라인).
      - name: Test
        working-directory: core
        run: ./gradlew --no-daemon test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Dockerfile 유효성 검증(레지스트리 push·CD 는 후속)
      - name: Build image
        run: docker build -t lia-core:ci ./core
